{% extends "base.html" %}

{% block content %}
<style>
    body {
        background-color: #FFFFFF !important;
        background-image: radial-gradient(circle at 85% 15%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                          radial-gradient(circle at 15% 85%, rgba(31, 31, 31, 0.02) 0%, transparent 50%) !important;
    }

    .navbar-custom {
        display: none !important;
    }

    .login-card {
        background-color: #FFFFFF;
        border: 1px solid #E5E7EB;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.05), 0 0 25px rgba(212, 175, 55, 0.06);
        border-radius: 24px;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: var(--brand-gradient);
    }

    .login-card .form-control {
        background-color: #FFFFFF !important;
        border: 1px solid #E5E7EB !important;
        color: #111827 !important;
        font-family: var(--font-body);
        transition: all 0.2s ease;
    }

    .login-card .form-control:focus {
        border-color: #D4AF37 !important;
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2) !important;
        background-color: #FFFFFF !important;
    }

    .login-brand-display {
        font-family: var(--font-display);
        font-weight: 900;
        letter-spacing: 1.5px;
    }

    .brand-hero-card {
        background-color: #FBFBFC;
        border: 1px solid #E5E7EB;
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.04);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .brand-hero-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 25px 55px rgba(212, 175, 55, 0.12);
    }

    .btn-login-submit {
        background: #E5B842 !important;
        color: #111111 !important;
        border: 1px solid #D4AF37;
        transition: all 0.25s ease;
    }

    .btn-login-submit:hover {
        background: #D4AF37 !important;
        color: #111111 !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }
</style>

<div class="row align-items-center justify-content-evenly" style="min-height: 88vh;">
    <!-- Columna Izquierda: Formulario de Acceso -->
    <div class="col-md-6 col-lg-5 mb-4">
        <div class="card login-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="mb-3 d-inline-block">
                    <img src="{{ url_for('static', filename='img/Maripocel.png') }}" 
                         alt="Maripocel Logo" 
                         class="img-fluid rounded-4 shadow-sm" 
                         style="width: 100px; height: 100px; object-fit: contain; background: #FFFFFF; padding: 6px; border: 2px solid #E5E7EB;">
                </div>
                <div class="d-flex justify-content-center align-items-center mb-1">
                    <span class="fs-2 fw-bold font-brand" style="color: #111827; font-family: var(--font-display); font-weight: 900; letter-spacing: 2px;">Maripocel</span>
                </div>
                <p class="text-muted small mb-0 fw-semibold" style="letter-spacing: 0.5px; color: #4B5563 !important;">ACCESORIOS & TECNOLOGÍA • POS & GESTIÓN</p>
            </div>
            
            <form method="POST" action="/auth/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label fw-bold text-dark small text-uppercase" style="letter-spacing: 0.5px; font-family: var(--font-heading);">Correo Electrónico</label>
                    <div class="input-group shadow-sm rounded-3 overflow-hidden">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="fa-solid fa-envelope" style="color: #D4AF37;"></i></span>
                        <input type="email" class="form-control form-control-lg border-start-0" name="email" required placeholder="admin@maripocel.com">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark small text-uppercase" style="letter-spacing: 0.5px; font-family: var(--font-heading);">Contraseña</label>
                    <div class="input-group shadow-sm rounded-3 overflow-hidden">
                        <span class="input-group-text bg-white border-end-0 text-secondary"><i class="fa-solid fa-lock" style="color: #D4AF37;"></i></span>
                        <input type="password" class="form-control form-control-lg border-start-0" name="password" required placeholder="••••••••">
                    </div>
                </div>
                
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-login-submit btn-lg rounded-pill fw-bold text-uppercase py-3 shadow" style="letter-spacing: 1px; font-family: var(--font-heading);">
                        Iniciar Sesión <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Columna Derecha: Branding Tech Visual Maripocel -->
    <div class="col-md-6 col-lg-5 d-none d-md-flex flex-column justify-content-center align-items-center text-center p-4">
        <div class="p-4 p-lg-5 brand-hero-card text-center" style="max-width: 440px; width: 100%;">
            <div class="mb-4 text-center">
                <img src="{{ url_for('static', filename='img/Maripocel.png') }}" 
                     alt="Maripocel - Accesorios & Tecnología Logo" 
                     class="img-fluid rounded-4 shadow-sm" 
                     style="max-width: 260px; width: 100%; height: auto; aspect-ratio: 1/1; object-fit: contain; background: #FFFFFF; padding: 14px; border: 1px solid #E5E7EB;">
            </div>
            <div class="display-5 login-brand-display mb-2">
                <span style="color: #111827; font-weight: 900;">Maripocel</span>
            </div>
            <div class="badge rounded-pill px-3 py-2 fw-semibold mb-3" style="background-color: rgba(212, 175, 55, 0.1); color: #926C09; border: 1px solid rgba(212, 175, 55, 0.35); font-size: 0.82rem; letter-spacing: 1px; font-family: var(--font-heading);">
                MARIPOCEL - ACCESORIOS & TECNOLOGÍA
            </div>
            <p class="text-secondary mb-0 fw-normal" style="line-height: 1.6; font-size: 0.92rem; font-family: var(--font-body); color: #4B5563 !important;">
                Plataforma integral para facturación de alta velocidad, control de inventario y gestión comercial de Maripocel - Accesorios & Tecnología.
            </p>
        </div>
    </div>
</div>
{% endblock %}
